<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Header row -->
  <rect x="4" y="4.5" width="24" height="6" rx="1" fill="url(#header)"/>

  <!-- Highlighted data row -->
  <rect x="4" y="16.5" width="24" height="5" rx="0.5" fill="url(#row)"/>

  <!-- Horizontal grid lines -->
  <line x1="4" y1="10.5" x2="28" y2="10.5" stroke="#3b82f6" stroke-width="0.4" opacity="0.5"/>
  <line x1="4" y1="15.5" x2="28" y2="15.5" stroke="#3b82f6" stroke-width="0.4" opacity="0.3"/>
  <line x1="4" y1="21.5" x2="28" y2="21.5" stroke="#3b82f6" stroke-width="0.4" opacity="0.2"/>

  <!-- Vertical column dividers -->
  <line x1="13" y1="4.5" x2="13" y2="27.5" stroke="#3b82f6" stroke-width="0.4" opacity="0.25"/>
  <line x1="21" y1="4.5" x2="21" y2="27.5" stroke="#3b82f6" stroke-width="0.4" opacity="0.25"/>

  <!-- Outer border -->
  <rect x="4" y="4.5" width="24" height="23" rx="1.5" fill="none" stroke="#3b82f6" stroke-width="0.6" opacity="0.6"/>

  <!-- Header labels (white bars) -->
  <rect x="5.5" y="7" width="5" height="1.5" rx="0.75" fill="#ffffff" opacity="0.7" filter="url(#glow)"/>
  <rect x="14" y="7" width="5" height="1.5" rx="0.75" fill="#ffffff" opacity="0.7"/>
  <rect x="22" y="7" width="4" height="1.5" rx="0.75" fill="#ffffff" opacity="0.7"/>

  <!-- Row 1 data bars -->
  <rect x="5.5" y="12.5" width="4" height="1.2" rx="0.6" fill="#3b82f6" opacity="0.45"/>
  <rect x="14" y="12.5" width="5.5" height="1.2" rx="0.6" fill="#3b82f6" opacity="0.45"/>
  <rect x="22" y="12.5" width="3.5" height="1.2" rx="0.6" fill="#3b82f6" opacity="0.45"/>

  <!-- Row 2 data bars (highlighted) -->
  <rect x="5.5" y="18" width="5.5" height="1.2" rx="0.6" fill="#60a5fa" opacity="0.8" filter="url(#glow)"/>
  <rect x="14" y="18" width="4" height="1.2" rx="0.6" fill="#60a5fa" opacity="0.8"/>
  <rect x="22" y="18" width="5" height="1.2" rx="0.6" fill="#60a5fa" opacity="0.8"/>

  <!-- Row 3 data bars (faded) -->
  <rect x="5.5" y="23.5" width="3.5" height="1.2" rx="0.6" fill="#3b82f6" opacity="0.25"/>
  <rect x="14" y="23.5" width="5" height="1.2" rx="0.6" fill="#3b82f6" opacity="0.25"/>
  <rect x="22" y="23.5" width="3" height="1.2" rx="0.6" fill="#3b82f6" opacity="0.25"/>
</svg>
